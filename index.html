<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جعبه ویدیو</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23ff6a13%27/%3E%3Cpath d=%27M12 9l11 7-11 7z%27 fill=%27%231a0a00%27/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0908;--s:#141210;--s2:#1c1916;--l:#2a2521;--fg:#f5f0ea;--mu:#a0968c;--ac:#ff6a13;--r:#ff5a5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 Vazirmatn,Tahoma,sans-serif;padding-bottom:20px}
a{color:inherit;text-decoration:none}header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--l);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font-weight:900;font-size:19px}.logo b{color:var(--ac)}header form{flex:1;min-width:140px}
nav{display:flex;gap:6px;flex-wrap:wrap}main{max-width:1000px;margin:0 auto;padding:16px}
input,textarea{width:100%;font:inherit;color:var(--fg);background:var(--s2);border:1px solid var(--l);border-radius:10px;padding:8px 12px;margin:4px 0}
button,.b{font:inherit;cursor:pointer;background:var(--ac);color:#1a0a00;font-weight:700;border:0;border-radius:10px;padding:7px 16px;display:inline-block}
.g{background:transparent;color:var(--fg);border:1px solid var(--l)}.g.on{border-color:var(--r);color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--s);border-radius:12px;overflow:hidden;border:1px solid var(--l)}.card video{width:100%;aspect-ratio:16/9;background:#000;display:block;object-fit:cover}.card div{padding:8px 12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--s2);object-fit:cover;display:inline-grid;place-items:center;font-weight:700;vertical-align:middle}.av.big{width:84px;height:84px;font-size:30px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--l);flex-wrap:wrap}.mu{color:var(--mu);font-size:13px}.box{max-width:420px;margin:20px auto}
.msgs{height:55vh;overflow:auto;background:var(--s);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:75%;padding:6px 12px;border-radius:12px;background:var(--s2);align-self:flex-start;white-space:pre-wrap;word-break:break-word}.m.me{align-self:flex-end;background:var(--ac);color:#1a0a00}
video.big{width:100%;max-height:70vh;background:#000;border-radius:12px}.err{color:var(--r)}
</style></head><body>
<header><a class="logo" href="#/">جعبه <b>ویدیو</b></a><form id="sf"><input id="q" placeholder="جستجوی آیدی یا نام (مثلا parsa)"></form><nav id="nav"></nav></header>
<main id="m"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='PASTE_YOUR_PROJECT_URL', SUPABASE_KEY='PASTE_YOUR_ANON_KEY';
const OK=/^https:\/\/[\w-]+\.supabase\.co/.test(SUPABASE_URL)&&SUPABASE_KEY.length>40;
const sb=OK?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const SQL=`-- Run once in Supabase > SQL Editor
create table profiles(
 id uuid primary key references auth.users on delete cascade,
 username text unique not null check (username ~ '^[a-z0-9_]{3,20}$'),
 name text default '', avatar_url text default '',
 role text not null default 'user' check (role in ('user','admin','owner')),
 banned bool not null default false, no_upload bool not null default false, no_chat bool not null default false,
 created_at timestamptz default now());
create table videos(id uuid primary key default gen_random_uuid(), owner uuid not null references profiles on delete cascade,
 title text not null, url text not null, path text not null, created_at timestamptz default now());
create table messages(id bigint generated always as identity primary key, sender uuid not null references profiles on delete cascade,
 receiver uuid not null references profiles on delete cascade, body text not null check(length(body)<=2000), created_at timestamptz default now());

create function is_owner() returns bool language sql security definer stable set search_path=public as $$
 select exists(select 1 from profiles where id=auth.uid() and role='owner') $$;
create function is_staff() returns bool language sql security definer stable set search_path=public as $$
 select exists(select 1 from profiles where id=auth.uid() and role in('admin','owner')) $$;
create function can_do(what text) returns bool language sql security definer stable set search_path=public as $$
 select exists(select 1 from profiles where id=auth.uid() and not banned and (case what when 'upload' then not no_upload when 'chat' then not no_chat else true end)) $$;

create function handle_new_user() returns trigger language plpgsql security definer set search_path=public as $$
declare u text; begin
 u:=lower(regexp_replace(coalesce(new.raw_user_meta_data->>'username',split_part(new.email,'@',1)),'[^a-z0-9_]','','g'));
 if length(u)<3 then u:='user'||substr(md5(random()::text),1,6); end if;
 u:=left(u,20);
 while exists(select 1 from profiles where username=u) loop u:=left(u,13)||substr(md5(random()::text),1,6); end loop;
 insert into profiles(id,username,name,avatar_url) values(new.id,u,coalesce(new.raw_user_meta_data->>'full_name',''),coalesce(new.raw_user_meta_data->>'avatar_url',''));
 return new; end $$;
create trigger on_signup after insert on auth.users for each row execute function handle_new_user();

create function guard_profile() returns trigger language plpgsql security definer set search_path=public as $$
begin if auth.uid() is not null and not is_owner() then
 new.role:=old.role; new.banned:=old.banned; new.no_upload:=old.no_upload; new.no_chat:=old.no_chat; end if; return new; end $$;
create trigger guard before update on profiles for each row execute function guard_profile();

alter table profiles enable row level security; alter table videos enable row level security; alter table messages enable row level security;
create policy p_sel on profiles for select using(true);
create policy p_upd on profiles for update using(id=auth.uid() or is_owner());
create policy v_sel on videos for select using(true);
create policy v_ins on videos for insert with check(owner=auth.uid() and can_do('upload'));
create policy v_del on videos for delete using(owner=auth.uid() or is_staff());
create policy m_sel on messages for select using(sender=auth.uid() or receiver=auth.uid());
create policy m_ins on messages for insert with check(sender=auth.uid() and can_do('chat'));

insert into storage.buckets(id,name,public,file_size_limit) values('videos','videos',true,52428800),('avatars','avatars',true,5242880) on conflict do nothing;
create policy s_read on storage.objects for select using(bucket_id in('videos','avatars'));
create policy s_ins on storage.objects for insert to authenticated with check(bucket_id in('videos','avatars') and (storage.foldername(name))[1]=auth.uid()::text and (bucket_id='avatars' or can_do('upload')));
create policy s_upd on storage.objects for update to authenticated using(bucket_id='avatars' and (storage.foldername(name))[1]=auth.uid()::text);
create policy s_del on storage.objects for delete to authenticated using((storage.foldername(name))[1]=auth.uid()::text or is_staff());

-- AFTER the owner has signed up once, run this to make that account the owner:
-- update profiles set role='owner' where id=(select id from auth.users where email='Parsaxgamer65@gmail.com');
`;
let me=null,timer=null;const $=s=>document.querySelector(s),M=()=>$('#m');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const av=(p,c='')=>p.avatar_url?`<img class="av ${c}" src="${esc(p.avatar_url)}" alt="">`:`<span class="av ${c}">${esc((p.name||p.username||'?')[0].toUpperCase())}</span>`;
const tag=p=>p.role==='owner'?' 👑':p.role==='admin'?' 🛡️':p.banned?' 🚫':'';
async function loadMe(){const{data:{session}}=await sb.auth.getSession();me=null;
 if(session){const{data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me=data}
 $('#nav').innerHTML=me?`<a class="b g" href="#/upload">آپلود</a><a class="b g" href="#/chat/">پیام‌ها</a>${me.role==='owner'?'<a class="b g" href="#/admin">مدیریت</a>':''}<a class="b g" href="#/me">${esc(me.username)}</a>`:'<a class="b" href="#/auth">ورود / ثبت‌نام</a>'}
$('#sf').onsubmit=e=>{e.preventDefault();location.hash='#/s/'+encodeURIComponent($('#q').value.trim().replace(/^@/,''))};
async function route(){clearInterval(timer);if(!OK||location.hash==='#/setup')return setup();const[,p,a]=(location.hash||'#/').split('/');const x=decodeURIComponent(a||'');
 try{({auth,u:chan,chat,upload,me:prof,admin,s:search,v:watch}[p]||home)(x)}catch(e){M().innerHTML='<p class="err">خطا: '+esc(e.message)+'</p>'}}
const need=()=>{if(!me){location.hash='#/auth';return 1}if(me.banned){M().innerHTML='<p class="err">حساب شما بن شده است.</p>';return 1}};
function cards(v){return v.length?`<div class="grid">${v.map(x=>`<a class="card" href="#/v/${x.id}"><video src="${esc(x.url)}#t=0.5" preload="metadata" muted></video><div><b>${esc(x.title)}</b><div class="mu" style="padding:0">${esc(x.profiles.username)}</div></div></a>`).join('')}</div>`:'<p class="mu">ویدیویی نیست.</p>'}
async function home(){const{data}=await sb.from('videos').select('*,profiles(username)').order('created_at',{ascending:false}).limit(60);M().innerHTML='<h2>تازه‌ها</h2>'+cards(data||[])}
async function watch(id){const{data:v}=await sb.from('videos').select('*,profiles(*)').eq('id',id).single();if(!v)return M().innerHTML='پیدا نشد';
 const can=me&&(me.id===v.owner||me.role!=='user');
 M().innerHTML=`<video class="big" src="${esc(v.url)}" controls autoplay playsinline></video><h2>${esc(v.title)}</h2><a class="row" href="#/u/${v.profiles.username}">${av(v.profiles)} <b>${esc(v.profiles.name||v.profiles.username)}</b>${tag(v.profiles)}</a>${can?'<button class="g" id="del" style="color:var(--r)">حذف</button>':''}`;
 if(can)$('#del').onclick=async()=>{if(!confirm('حذف شود؟'))return;await sb.storage.from('videos').remove([v.path]);await sb.from('videos').delete().eq('id',v.id);location.hash='#/'}}
async function search(t){const{data}=await sb.from('profiles').select('*').or(`username.ilike.%${t.replace(/[%,()]/g,'')}%,name.ilike.%${t.replace(/[%,()]/g,'')}%`).limit(30);
 M().innerHTML=`<h2>نتایج «${esc(t)}»</h2>`+((data||[]).map(p=>`<a class="row" href="#/u/${p.username}">${av(p)}<span><b>${esc(p.name||p.username)}</b>${tag(p)}<br><span class="mu">@${p.username}</span></span></a>`).join('')||'<p class="mu">کاربری پیدا نشد.</p>')}
async function chan(un){const{data:p}=await sb.from('profiles').select('*').eq('username',un).single();if(!p)return M().innerHTML='کاربر پیدا نشد';
 const{data:v}=await sb.from('videos').select('*,profiles(username)').eq('owner',p.id).order('created_at',{ascending:false});
 M().innerHTML=`<div class="row">${av(p,'big')}<div><h2 style="margin:0">${esc(p.name||p.username)}${tag(p)}</h2><span class="mu">@${p.username}</span></div>${me&&me.id!==p.id?`<a class="b" href="#/chat/${p.username}">پیام</a>`:''}</div>`+cards(v||[])}
async function chat(un){if(need())return;
 if(!un){const{data}=await sb.from('messages').select('sender,receiver').or(`sender.eq.${me.id},receiver.eq.${me.id}`).order('id',{ascending:false}).limit(300);
  const ids=[...new Set((data||[]).map(m=>m.sender===me.id?m.receiver:m.sender))];
  const{data:ps}=ids.length?await sb.from('profiles').select('*').in('id',ids):{data:[]};
  M().innerHTML='<h2>پیام‌ها</h2>'+(ids.map(i=>ps.find(p=>p.id===i)).filter(Boolean).map(p=>`<a class="row" href="#/chat/${p.username}">${av(p)}<b>${esc(p.name||p.username)}</b></a>`).join('')||'<p class="mu">برای شروع، آیدی دوستت را بالا جستجو کن.</p>');return}
 const{data:p}=await sb.from('profiles').select('*').eq('username',un).single();if(!p)return M().innerHTML='کاربر پیدا نشد';
 M().innerHTML=`<a class="row" href="#/u/${p.username}">${av(p)}<b>${esc(p.name||p.username)}</b></a><div class="msgs" id="ms"></div>${me.no_chat?'<p class="err">اجازه چت ندارید.</p>':'<form id="cf" class="row"><input id="tx" style="flex:1" placeholder="پیام..." autocomplete="off"><button>ارسال</button></form>'}`;
 const load=async()=>{const{data}=await sb.from('messages').select('*').or(`and(sender.eq.${me.id},receiver.eq.${p.id}),and(sender.eq.${p.id},receiver.eq.${me.id})`).order('id').limit(200);
  const b=$('#ms');if(!b)return;const k=b.scrollTop+b.clientHeight>=b.scrollHeight-40;b.innerHTML=(data||[]).map(m=>`<div class="m ${m.sender===me.id?'me':''}">${esc(m.body)}</div>`).join('');if(k)b.scrollTop=b.scrollHeight};
 await load();$('#ms').scrollTop=1e9;timer=setInterval(load,3000);
 if($('#cf'))$('#cf').onsubmit=async e=>{e.preventDefault();const t=$('#tx').value.trim();if(!t)return;$('#tx').value='';const{error}=await sb.from('messages').insert({sender:me.id,receiver:p.id,body:t});if(error)alert('ارسال نشد: '+error.message);await load();$('#ms').scrollTop=1e9}}
async function upload(){if(need())return;if(me.no_upload)return M().innerHTML='<p class="err">اجازه آپلود ندارید.</p>';
 M().innerHTML='<div class="box"><h2>آپلود ویدیو</h2><input id="t" placeholder="عنوان"><input id="f" type="file" accept="video/*"><p class="mu">حداکثر ۵۰ مگابایت</p><button id="go">آپلود</button> <span id="st" class="mu"></span></div>';
 $('#go').onclick=async()=>{const f=$('#f').files[0],t=$('#t').value.trim()||'بدون نام';if(!f)return;if(f.size>52428800)return $('#st').textContent='فایل بیشتر از ۵۰ مگابایت است';
  $('#go').disabled=true;$('#st').textContent='در حال آپلود...';const path=`${me.id}/${Date.now()}.${(f.name.split('.').pop()||'mp4').replace(/[^a-z0-9]/gi,'')}`;
  let r=await sb.storage.from('videos').upload(path,f,{contentType:f.type});if(r.error){$('#st').textContent=r.error.message;$('#go').disabled=false;return}
  const url=sb.storage.from('videos').getPublicUrl(path).data.publicUrl;r=await sb.from('videos').insert({owner:me.id,title:t,url,path});
  if(r.error){$('#st').textContent=r.error.message;$('#go').disabled=false}else location.hash='#/u/'+me.username}}
async function prof(){if(need())return;
 M().innerHTML=`<div class="box"><div class="row">${av(me,'big')}<input id="pf" type="file" accept="image/*"></div><label>نام</label><input id="nm" value="${esc(me.name)}"><label>آیدی (فقط a-z 0-9 _)</label><input id="un" dir="ltr" value="${esc(me.username)}"><button id="sv">ذخیره</button> <button class="g" id="lo">خروج</button><p id="st" class="mu"></p></div>`;
 $('#lo').onclick=async()=>{await sb.auth.signOut();await loadMe();location.hash='#/'};
 $('#sv').onclick=async()=>{const un=$('#un').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(un))return $('#st').textContent='آیدی نامعتبر است (۳ تا ۲۰ حرف انگلیسی/عدد/_)';
  let up={name:$('#nm').value.trim().slice(0,40),username:un},f=$('#pf').files[0];
  if(f){if(f.size>5242880)return $('#st').textContent='عکس بیشتر از ۵ مگابایت است';const path=`${me.id}/avatar`;
   const r=await sb.storage.from('avatars').upload(path,f,{upsert:true,contentType:f.type});if(r.error)return $('#st').textContent=r.error.message;up.avatar_url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?t='+Date.now()}
  const{error}=await sb.from('profiles').update(up).eq('id',me.id);if(error)return $('#st').textContent=error.code==='23505'?'این آیدی گرفته شده':error.message;await loadMe();prof()}}
async function admin(){if(!me||me.role!=='owner')return M().innerHTML='دسترسی ندارید';
 const{data}=await sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(200);
 M().innerHTML='<h2>مدیریت کاربران</h2>'+data.map(p=>`<div class="row" data-id="${p.id}">${av(p)}<b style="flex:1">@${p.username}${tag(p)}</b>${p.role==='owner'?'<span class="mu">owner</span>':[['role','ادمین'],['banned','بن'],['no_upload','بدون آپلود'],['no_chat','بدون چت']].map(([k,l])=>`<button class="g ${(k==='role'?p.role==='admin':p[k])?'on':''}" data-k="${k}">${l}</button>`).join('')}</div>`).join('');
 M().onclick=async e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,id=b.closest('[data-id]').dataset.id,p=data.find(x=>x.id===id);
  const up=k==='role'?{role:p.role==='admin'?'user':'admin'}:{[k]:!p[k]};const{error}=await sb.from('profiles').update(up).eq('id',id);if(error)alert(error.message);else admin()}}
function setup(){M().innerHTML=`<div class="box" style="max-width:760px"><h2>راه‌اندازی</h2>${OK?'':'<p class="err">کلیدهای Supabase هنوز داخل فایل وارد نشده‌اند.</p>'}
 <ol><li>در supabase.com یک پروژه بساز.</li><li>از Project Settings ← API مقدار <b>Project URL</b> و <b>anon public key</b> را در ابتدای تگ script همین فایل بگذار (SUPABASE_URL و SUPABASE_KEY).</li><li>در SQL Editor کد زیر را یک‌بار اجرا کن.</li><li>در Authentication ← URL Configuration آدرس سایت گیت‌هاب‌ات را در Site URL و Redirect URLs بگذار (مثلا https://USERNAME.github.io/REPO/).</li><li>بعد از اولین ثبت‌نام خودت، خط آخر SQL (update ... role='owner') را با ایمیل خودت اجرا کن.</li></ol>
 <button id="cp">کپی SQL</button><pre dir="ltr" style="background:var(--s);border:1px solid var(--l);border-radius:10px;padding:12px;overflow:auto;max-height:50vh;font-size:12px;white-space:pre-wrap">${esc(SQL)}</pre></div>`;
 $('#cp').onclick=()=>navigator.clipboard.writeText(SQL).then(()=>$('#cp').textContent='کپی شد ✓')}
function auth(){let mode='in';const draw=()=>{M().innerHTML=`<div class="box"><div class="row"><button class="${mode==='in'?'':'g'}" id="a1">ورود</button><button class="${mode==='up'?'':'g'}" id="a2">ثبت‌نام</button></div>
 <input id="em" type="email" dir="ltr" placeholder="ایمیل">${mode==='up'?'<input id="un" dir="ltr" placeholder="آیدی دلخواه (انگلیسی)">':''}<input id="pw" type="password" dir="ltr" placeholder="رمز عبور">${mode==='up'?'<input id="p2" type="password" dir="ltr" placeholder="تکرار رمز عبور">':''}
 <button id="go" style="width:100%;margin-top:8px">${mode==='in'?'ورود':'ساخت حساب'}</button><button class="g" id="gg" style="width:100%;margin-top:8px">ورود با حساب گوگل</button><p id="st" class="err"></p></div>`;
 $('#a1').onclick=()=>{mode='in';draw()};$('#a2').onclick=()=>{mode='up';draw()};
 $('#gg').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
 $('#go').onclick=async()=>{const st=$('#st'),email=$('#em').value.trim(),pw=$('#pw').value;let r;
  if(mode==='up'){const un=$('#un').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(un))return st.textContent='آیدی نامعتبر است (۳ تا ۲۰ حرف انگلیسی/عدد/_)';
   if(pw.length<6)return st.textContent='رمز حداقل ۶ کاراکتر باشد';if(pw!==$('#p2').value)return st.textContent='رمز و تکرارش یکی نیست';
   const{data:ex}=await sb.from('profiles').select('id').eq('username',un).maybeSingle();if(ex)return st.textContent='این آیدی گرفته شده';
   r=await sb.auth.signUp({email,password:pw,options:{data:{username:un}}});if(!r.error&&!r.data.session)return st.textContent='ایمیل تأیید برایت فرستاده شد؛ بعد از تأیید وارد شو.'}
  else r=await sb.auth.signInWithPassword({email,password:pw});
  if(r.error)return st.textContent=r.error.message;await loadMe();location.hash='#/'}};draw()}
window.addEventListener('hashchange',route);
if(OK){sb.auth.onAuthStateChange(()=>loadMe());loadMe().then(route)}else route();
</script></body></html>
