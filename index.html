<style>
  /* Layout: sticky top bar (tabs move to a bottom bar on phones). Watch = featured hero + filter chips + thumbnail grid.
     Shorts = full-height snap feed. Player = full-screen overlay. Black ground, one orange accent, single dark theme by design. */
  :root {

  * { box-sizing: border-box; }

  }
  body.lock { overflow: hidden; }

  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 50; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .ic { display: inline-flex; flex: none; }

  button { font: inherit; cursor: pointer; color: inherit; }

  /* top bar + tabs */

      padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }

  .toast { position: fixed; inset-inline: 16px; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: fit-content; max-width: 420px; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 12px; padding: 10px 18px; text-align: center; z-index: 80; box-shadow: 0 8px 30px rgba(0,0,0,.5); }

  .play span { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .play svg { fill: var(--accent-ink); stroke: none; width: 20px; height: 20px; }

</style>

    if (!S.assets) m.appendChild(el("div", "note", S.loaded ? "آپلود فقط برای صاحب و ویرایشگرهای سایت فعاله. اگه صاحب سایتی با حسابت وارد شو و صفحه رو دوباره باز کن." : "در حال اتصال به ذخیره‌سازی…"));
    var d = el("label", "drop"), inp = document.createElement("input");
    inp.type = "file"; inp.accept = "video/mp4,video/webm,.mp4,.webm"; inp.multiple = true; inp.id = "file"; d.appendChild(inp);
    var u = el("div", "up-icon"); u.appendChild(ic("up")); d.appendChild(u);
    d.appendChild(el("h2", null, "ویدیوها رو اینجا رها کن")); d.appendChild(el("p", null, "یا برای انتخاب فایل بزن روی دکمه"));
    d.appendChild(el("span", "btn", "انتخاب ویدیو")); d.appendChild(el("span", "count", "MP4 · WEBM · MAX 20 MB"));
    inp.addEventListener("change", function () { addFiles(inp.files); inp.value = ""; });
    ["dragenter", "dragover"].forEach(function (n) { d.addEventListener(n, function (e) { e.preventDefault(); d.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (n) { d.addEventListener(n, function (e) { e.preventDefault(); d.classList.remove("over"); }); });
    d.addEventListener("drop", function (e) { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });
    m.appendChild(d);
    var qb = el("div", "queue"); qb.id = "queue"; m.appendChild(qb); renderQueue();
    var us = el("p", "count", S.usage ? "فضای استفاده‌شده: " + fmtSize(S.usage.bytes) + " از " + fmtSize(S.usage.maxBytes) : ""); us.id = "usage"; m.appendChild(us);
  }

  /* ---------- profile + account ---------- */
  function statTile(label, val) { var d = el("div"); d.appendChild(el("b", null, fa.format(val))); d.appendChild(document.createTextNode(label)); return d; }
  function pProfile(m) {
    var id = S.viewing || S.me.id; S.viewing = null;
    var mine = !!id && id === S.me.id;
    if (!id) { m.appendChild(emptyBox("وارد نشدی", "برای داشتن پروفایل باید با حساب Claude وارد بشی.")); return; }
    if (!RX_UID.test(id)) { m.appendChild(emptyBox("پروفایل پیدا نشد", "")); return; }
    var p = S.profiles[id] || {}, list = S.videos.filter(function (v) { return v.ownerId === id; });
    var box = el("div", "panel"), me = el("div", "me"), src = avatarOf(id);
    if (src) { var im = document.createElement("img"); im.src = src; im.alt = ""; me.appendChild(im); }
    var t = el("div"); t.appendChild(el("div", "n", nameOf(id))); if (p.bio) t.appendChild(el("div", "sub", p.bio)); me.appendChild(t); box.appendChild(me);
    var st = el("div", "stats");
    st.appendChild(statTile("ویدیو", list.length));
    st.appendChild(statTile("لایک", list.reduce(function (a, v) { return a + nLikes(v.id); }, 0)));
    st.appendChild(statTile("بازدید", list.reduce(function (a, v) { return a + nViews(v.id); }, 0)));
    box.appendChild(st);
    if (mine) {
      var l1 = el("label", "f", "نام نمایشی"), i1 = document.createElement("input"); i1.type = "text"; i1.id = "pname"; i1.maxLength = 40; i1.value = p.name || ""; i1.placeholder = S.me.name || "اسمت"; l1.appendChild(i1);
      var l2 = el("label", "f", "درباره‌ی من"), i2 = document.createElement("textarea"); i2.id = "pbio"; i2.maxLength = 200; i2.value = p.bio || ""; l2.appendChild(i2);
      var sv = btn("btn", "ذخیره"), msg = el("span", "count");
      sv.addEventListener("click", async function () {
        if (!S.pcol) { msg.textContent = "ذخیره‌سازی در دسترس نیست."; return; }
        sv.disabled = true;
        try { await S.pcol.doc(id).set({ name: sane(i1.value, 40), bio: sane(i2.value, 200, true) }); msg.textContent = "ذخیره شد."; }
        catch (e) { msg.textContent = "ذخیره نشد. دوباره امتحان کن."; }
        sv.disabled = false;
      });
      var r = el("div", "actions"); r.appendChild(sv); r.appendChild(msg); box.appendChild(l1); box.appendChild(l2); box.appendChild(r);
    }
    m.appendChild(box);
    var hd = el("div", "row"); hd.appendChild(el("h2", null, mine ? "ویدیوهای من" : "ویدیوهای این کاربر")); hd.appendChild(el("span", "count", fa.format(list.length) + " مورد")); m.appendChild(hd);
    if (!list.length) { m.appendChild(emptyBox("هنوز ویدیویی نیست", mine ? "از صفحه‌ی آپلود شروع کن." : "این کاربر ویدیویی آپلود نکرده.", mine ? ["آپلود ویدیو", "#upload"] : null)); return; }
    var g = el("div", "grid");
    list.forEach(function (v) {
      if (mine && S.editId === v.id) { var w = el("div", "own"); w.appendChild(editForm(v)); g.appendChild(w); }
      else g.appendChild(card(v, mine));
    });
    m.appendChild(g); refreshSocial();
  }
  function pAccount(m) {
    var h1 = el("h1"); h1.innerHTML = "<span>اکانت</span>"; m.appendChild(h1);
    var box = el("div", "panel"), me = el("div", "me"), im = document.createElement("img"); im.src = S.me.avatarUrl; im.alt = ""; me.appendChild(im);
    var t = el("div"); t.appendChild(el("div", "n", S.me.id ? (S.me.name || "بدون نام") : "مهمان")); t.appendChild(el("div", "sub", S.me.id ? "وارد شدی" : "با حساب Claude وارد نشدی")); me.appendChild(t); box.appendChild(me);
    var dl = el("dl", "kv");
    function row(k, v, on) { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", on ? "on" : null, v)); }
    var mine = S.videos.filter(function (v) { return S.me.id && v.ownerId === S.me.id; });
    row("آپلود ویدیو", S.assets ? "فعال" : "غیرفعال", !!S.assets);
    row("لایک و کامنت", S.me.id && S.canWrite !== false ? "فعال" : "غیرفعال", !!(S.me.id && S.canWrite !== false));
    row("نقش", S.me.isOwner ? "صاحب سایت" : S.me.canEdit ? "ویرایشگر" : "بیننده", false);
    row("ویدیوهای من", fa.format(mine.length), false);
    row("لایک دریافتی", fa.format(mine.reduce(function (a, v) { return a + nLikes(v.id); }, 0)), false);
    box.appendChild(dl); m.appendChild(box);
    m.appendChild(el("div", "note", "این سایت ثبت‌نام جدا نداره. با حساب Claude خودت وارد می‌شی و ورود و خروج از منوی claude.ai انجام می‌شه. دسترسی بقیه رو هم از منوی Share تعیین می‌کنی."));
    var sec = el("div", "panel"); sec.appendChild(el("h2", null, "امنیت"));
    ["لایک، کامنت، بازدید و پروفایل هر نفر توی سند مخصوص خودش ذخیره می‌شه و فقط خودش می‌تونه ازش بنویسه. کسی نمی‌تونه از طرف بقیه لایک یا کامنت بذاره.",
     "ویدیوها فقط توسط صاحب و ویرایشگرهای سایت آپلود می‌شن و هر نفر فقط سند ویدیوهای خودش رو عوض می‌کنه.",
     "هر چیزی که از ذخیره‌سازی خونده می‌شه قبل از نمایش پاک‌سازی و اعتبارسنجی می‌شه.",
     "فایل آپلودی از نظر محتوای واقعی MP4 یا WEBM بودن بررسی می‌شه، نه فقط از روی پسوند."].forEach(function (t) { sec.appendChild(el("p", "sub", t)); });
    m.appendChild(sec);
  }

  /* ---------- shell ---------- */
  function buildNav() {
    var n = $("#nav");
    PAGES.forEach(function (p) { var a = el("a"); a.href = "#" + p[0]; a.dataset.p = p[0]; a.appendChild(ic(p[0])); a.appendChild(el("span", null, p[1])); n.appendChild(a); });
  }
  function render() {
    var p = page();
    document.querySelectorAll("#nav a").forEach(function (a) { if (a.dataset.p === p) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (io) { io.disconnect(); io = null; }
    var m = $("#main"); m.textContent = "";
    ({ watch: pWatch, shorts: pShorts, upload: pUpload, profile: pProfile, account: pAccount })[p](m);
  }
  function onData() {
    var p = page();
    if (p === "watch") fillWatch();
    else if (p === "shorts") { var f = $("#feed"), key = S.videos.filter(function (v) { return v.kind === "short"; }).map(function (v) { return v.id; }).join(","); if (!f || f.dataset.key !== key) { if (!f || !document.activeElement || !f.contains(document.activeElement) || document.activeElement.tagName !== "INPUT") render(); } }
    else if (p === "profile" || p === "account") { var ae = document.activeElement; if (!(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && $("#main").contains(ae))) render(); }
    refreshSocial();
  }
  window.addEventListener("hashchange", function () { closePlayer(); render(); window.scrollTo(0, 0); });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (e.key === "Escape") { closePlayer(); return; }
    if (/INPUT|TEXTAREA|SELECT/.test(tag) || page() !== "shorts" || S.openId) return;
    var feed = $("#feed"); if (!feed) return;
    var cur = feed.querySelector('.short[data-active="1"]'), vid = cur && cur.querySelector("video");
    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); feed.scrollBy({ top: feed.clientHeight, behavior: "smooth" }); }
    else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); feed.scrollBy({ top: -feed.clientHeight, behavior: "smooth" }); }
    else if (e.key === "m") setMuted(!S.muted);
    else if (e.key === "l" && cur) toggleLike(S.byId[cur.dataset.id]);
    else if (e.key === " " && vid && tag !== "BUTTON") { e.preventDefault(); if (vid.paused) { vid.play().catch(function () {}); cur.classList.remove("ps"); } else { vid.pause(); cur.classList.add("ps"); } }
  });

  buildNav(); render();

  /* ---------- connect storage ---------- */
  (async function () {
    try {
      var c = window.claude; if (!c || !c.use) throw 0;
      var user = await c.use("user");
      if (user) { S.me = await user.me(); S.me.name = sane(S.me.name, 60); if (!okAvatar(S.me.avatarUrl)) S.me.avatarUrl = ""; if (S.me.id && !RX_UID.test(S.me.id)) S.me.id = null; S.userCap = user; try { S.canWrite = await user.can("data.write"); } catch (e) {} }
      S.assets = await c.use("assets");
      var db = await c.use("db");
      if (db) {
        S.dbOn = true; S.col = db.collection("videos"); S.pcol = db.collection("profiles");
        S.lcol = db.collection("likes"); S.ccol = db.collection("comments"); S.vcol = db.collection("views");
        S.pcol.onSnapshot(function (snap) {
          var o = {}; snap.docs.forEach(function (d) { if (!RX_UID.test(d.id)) return; var x = d.data() || {}; o[d.id] = { name: sane(x.name, 40), bio: sane(x.bio, 200, true) }; });
          S.profiles = o; onData();
        }, function () {});
        S.lcol.onSnapshot(function (snap) { S.likeDocs = parseKeyDocs(snap, MAXL); rebuildMap(S.likeDocs, "likes"); refreshSocial(); if (page() === "watch" && S.sort === "likes") fillWatch(); }, function () {});
        S.vcol.onSnapshot(function (snap) { S.viewDocs = parseKeyDocs(snap, MAXW); rebuildMap(S.viewDocs, "views"); refreshSocial(); if (page() === "watch" && S.sort === "views") fillWatch(); }, function () {});
        S.ccol.onSnapshot(async function (snap) { parseCmt(snap); refreshSocial(); await resolveNames(); refreshSocial(); }, function () {});
        S.col.onSnapshot(async function (snap) { parseVideos(snap); S.loaded = true; await resolveNames(); onData(); }, function () { S.loaded = true; onData(); });
      }
      if (S.assets) { try { S.usage = (await S.assets.list()).usage; } catch (e) {} }
      if (!db) S.loaded = true;
      if (page() === "upload" || page() === "account" || !db) render();
    } catch (e) { S.loaded = true; render(); }
  })();
})();
</script>

</body></html>
