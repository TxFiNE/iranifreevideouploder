<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>جعبه ویدیو</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&display=swap">
<style>
  /* Layout: sticky top bar (tabs move to a bottom bar on phones). Watch = featured hero + filter chips + thumbnail grid.
     Shorts = full-height snap feed. Player = full-screen overlay. Black ground, one orange accent, single dark theme by design. */
  :root {
    --bg: #0a0908;
    --surface: #141210;
    --surface-2: #1c1916;
    --line: #2a2521;
    --fg: #f5f0ea;
    --muted: #a0968c;
    --accent: #ff6a13;
    --accent-hi: #ff8a3d;
    --accent-ink: #1a0a00;
    --glow: rgba(255, 106, 19, .16);
    --danger: #ff5a5a;
    --font-body: "Vazirmatn", "Tahoma", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body);
    font-size: 15px; line-height: 1.7; direction: rtl; margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 56px;
  }
  body.lock { overflow: hidden; }
  [hidden] { display: none !important; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 50; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .ic { display: inline-flex; flex: none; }
  .ic svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: var(--font-mono); direction: ltr; unicode-bidi: isolate; }
  button { font: inherit; cursor: pointer; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* top bar + tabs */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 20px; text-decoration: none; }
  .brand b { color: var(--accent); }
  .mark { width: 34px; height: 34px; background: var(--accent); border-radius: 10px; display: grid; place-items: center; box-shadow: 0 0 24px var(--glow); }
  .mark svg { width: 16px; height: 16px; fill: var(--accent-ink); }
  nav.tabs { display: flex; gap: 4px; }
  nav.tabs a { display: flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; padding: 7px 14px; border-radius: 12px; white-space: nowrap; transition: color .15s, background .15s; }
  nav.tabs a:hover { color: var(--fg); background: var(--surface); }
  nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
  @media (max-width: 720px) {
    body { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
    nav.tabs { position: fixed; inset: auto 0 0 0; z-index: 25; background: var(--bg); border-top: 1px solid var(--line); justify-content: space-around; gap: 0;
      padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
    nav.tabs a { flex: 1; flex-direction: column; gap: 1px; font-size: 11px; padding: 5px 4px; justify-content: center; }
    nav.tabs a .ic svg { width: 22px; height: 22px; }
  }

  main { padding-top: 20px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  h1 { margin: 0; font-size: clamp(24px, 5vw, 34px); font-weight: 900; line-height: 1.2; text-wrap: balance; }
  h1 span { color: var(--accent); }
  h2 { margin: 0; font-size: 19px; font-weight: 800; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }

  /* buttons + fields */
  .btn { background: var(--accent); color: var(--accent-ink); font-weight: 800; border: 0; border-radius: 12px; padding: 9px 22px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: background .15s, transform .1s; }
  .btn:hover { background: var(--accent-hi); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: default; }
  .ghost { font-size: 13px; font-weight: 600; border-radius: 10px; padding: 4px 14px; background: transparent; border: 1px solid var(--line); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .ghost.del:hover { border-color: var(--danger); color: var(--danger); }
  .ghost.confirm { border-color: var(--danger); background: var(--danger); color: #1a0000; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=search], textarea, select { font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; }
  select { width: auto; }
  textarea { min-height: 84px; resize: vertical; }
  label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .note { border-radius: 12px; padding: 12px 16px; font-size: 14px; border: 1px solid #4a3526; background: var(--surface); color: #ffd3b3; }
  .panel { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .empty { border: 1px dashed #3b2f26; border-radius: 20px; background: radial-gradient(circle at 50% 0, var(--glow), transparent 70%), var(--surface); padding: 48px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .empty b { color: var(--fg); font-size: 18px; }
  .toast { position: fixed; inset-inline: 16px; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: fit-content; max-width: 420px; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 12px; padding: 10px 18px; text-align: center; z-index: 80; box-shadow: 0 8px 30px rgba(0,0,0,.5); }

  /* toolbar */
  .tb { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .search { position: relative; flex: 1 1 260px; display: block; }
  .search .ic { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input { padding-inline-start: 38px; border-radius: 99px; background: var(--surface); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--surface); border: 1px solid var(--line); color: var(--muted); border-radius: 99px; padding: 4px 14px; font-size: 13px; font-weight: 600; }
  .chip:hover { color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* thumbnails + cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 22px 18px; }
  .vc { display: flex; flex-direction: column; gap: 10px; min-width: 0; cursor: pointer; border-radius: 14px; }
  .vc:hover .thumb { border-color: var(--accent); }
  .vc:hover .play { opacity: 1; transform: scale(1); }
  .thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); transition: border-color .15s; }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .dur { position: absolute; inset-inline-end: 8px; bottom: 8px; background: rgba(0,0,0,.78); border-radius: 6px; padding: 0 7px; font-size: 12px; }
  .thumb .kp { position: absolute; inset-inline-start: 8px; top: 8px; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 0 8px; font-size: 11px; font-weight: 800; }
  .play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transform: scale(.9); transition: opacity .15s, transform .15s; background: rgba(0,0,0,.25); }
  .play span { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .play svg { fill: var(--accent-ink); stroke: none; width: 20px; height: 20px; }
  .vc h3 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); align-items: center; }
  .stat { display: inline-flex; align-items: center; gap: 4px; }
  .stat .ic svg { width: 14px; height: 14px; }
  .who { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); text-decoration: none; font-size: 13px; font-weight: 600; }
  .who img { width: 22px; height: 22px; border-radius: 50%; }
  .who:hover { color: var(--accent); }
  .sk { border-radius: 14px; aspect-ratio: 16 / 12; background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* hero */
  .hero { position: relative; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); cursor: pointer; background: var(--surface); display: block; text-align: start; width: 100%; padding: 0; }
  .hero .thumb { aspect-ratio: 21 / 9; border: 0; border-radius: 0; }
  .hero .cover { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(10,9,8,.96) 5%, rgba(10,9,8,.2) 65%), radial-gradient(circle at 100% 0, var(--glow), transparent 55%); display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: clamp(14px, 3vw, 28px); }
  .hero h2 { font-size: clamp(20px, 4vw, 34px); font-weight: 900; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
  .hero p { margin: 0; color: #d8cec4; max-width: 60ch; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hero .btn { align-self: flex-start; pointer-events: none; }
  .hero:hover { border-color: var(--accent); }
  @media (max-width: 600px) { .hero .thumb { aspect-ratio: 4 / 3; } }

  /* social */
  .soc { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 5px 16px; transition: border-color .15s, color .15s; }
  .sbtn:hover { border-color: var(--accent); }
  .sbtn.on { color: var(--accent); border-color: var(--accent); }
  .sbtn.on .ic svg { fill: var(--accent); }
  .desc { font-size: 14px; color: #d3c9bf; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .desc.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .more { background: none; border: 0; color: var(--accent); font-size: 13px; padding: 0; font-weight: 700; align-self: flex-start; }
  .cbox { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .clist { display: flex; flex-direction: column; gap: 12px; }
  .cm { display: flex; gap: 10px; font-size: 14px; align-items: flex-start; }
  .cm img { width: 30px; height: 30px; border-radius: 50%; flex: none; }
  .cm .tx { min-width: 0; flex: 1; overflow-wrap: anywhere; }
  .cm b { font-weight: 700; }
  .cm .dt { color: var(--muted); font-size: 11px; margin-inline-start: 8px; }
  .cm .x { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 0 4px; }
  .cm .x:hover { color: var(--danger); }
  .cform { display: flex; gap: 8px; }
  .cform input { flex: 1; min-width: 0; }

  /* shorts */
  .feed { --h: calc(100dvh - 170px); height: var(--h); min-height: 440px; overflow-y: scroll; scroll-snap-type: y mandatory; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; overscroll-behavior: contain; }
  .feed::-webkit-scrollbar { display: none; }
  @media (max-width: 720px) { .feed { --h: calc(100dvh - 150px - env(safe-area-inset-bottom, 0px)); } }
  .short { scroll-snap-align: center; scroll-snap-stop: always; flex: none; height: 100%; aspect-ratio: 9 / 16; max-width: 100%; margin: 0 auto; position: relative; background: #000; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); user-select: none; -webkit-user-select: none; }
  .short video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .short .cap { position: absolute; inset: auto 0 0 0; padding: 60px 16px 18px; padding-inline-end: 84px; background: linear-gradient(transparent, rgba(0,0,0,.88)); display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
  .short .cap h3 { margin: 0; font-size: 16px; font-weight: 800; overflow-wrap: anywhere; }
  .short .cap .desc { color: #e6ddd3; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .short .cap .who { pointer-events: auto; align-self: flex-start; }
  .rail { position: absolute; inset-inline-end: 10px; bottom: 18px; display: flex; flex-direction: column; gap: 12px; align-items: center; z-index: 2; }
  .rail .sbtn { flex-direction: column; gap: 2px; border-radius: 18px; padding: 9px 8px; background: rgba(0,0,0,.55); border-color: rgba(255,255,255,.12); min-width: 56px; justify-content: center; font-size: 12px; }
  .rail .sbtn .ic svg { width: 26px; height: 26px; }
  .short .snd { position: absolute; top: 12px; inset-inline-start: 12px; z-index: 2; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.12); border-radius: 99px; width: 40px; height: 40px; display: grid; place-items: center; }
  .short .pos { position: absolute; top: 18px; left: 14px; z-index: 2; font-size: 12px; background: rgba(0,0,0,.55); border-radius: 99px; padding: 0 10px; }
  .pbar { position: absolute; inset: auto 0 0 0; height: 3px; background: rgba(255,255,255,.18); z-index: 3; }
  .pbar i { display: block; height: 100%; width: 0; background: var(--accent); margin-inline-start: auto; }
  .ind { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 1; }
  .ind span { width: 74px; height: 74px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; }
  .ind svg { width: 30px; height: 30px; fill: #fff; stroke: none; }
  .short.ps .ind { opacity: 1; }
  .burst { position: absolute; z-index: 4; pointer-events: none; width: 90px; height: 90px; margin: -45px 0 0 -45px; color: var(--accent); animation: burst .75s ease-out forwards; }
  .burst svg { width: 100%; height: 100%; fill: var(--accent); stroke: none; }
  @keyframes burst { 0% { transform: scale(.3); opacity: 1; } 35% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1.5) translateY(-30px); opacity: 0; } }
  .sheet { position: absolute; inset: auto 0 0 0; height: 68%; background: var(--surface); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 14px; display: flex; flex-direction: column; gap: 10px; z-index: 6; }
  .sheet .clist { flex: 1; overflow-y: auto; min-height: 60px; }
  .sheet .top2 { display: flex; justify-content: space-between; align-items: center; }
  .keys { font-size: 12px; color: var(--muted); text-align: center; }
  @media (hover: none) { .keys { display: none; } }

  /* upload */
  .drop { position: relative; border: 2px dashed #4a3526; border-radius: 22px; background: radial-gradient(circle at 50% 0, var(--glow), transparent 70%), var(--surface); padding: clamp(30px, 6vw, 56px) 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; cursor: pointer; transition: border-color .2s, transform .2s; }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop.over { transform: scale(1.01); }
  .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop .btn { pointer-events: none; }
  .drop p { margin: 0; color: var(--muted); font-size: 14px; }
  .up-icon { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; color: var(--accent); }
  .up-icon svg { width: 28px; height: 28px; }
  .queue { display: flex; flex-direction: column; gap: 12px; }
  .q { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: start; }
  .q .pv { aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  .q .pv img { width: 100%; height: 100%; object-fit: cover; }
  .q .fields { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .q .two { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .q .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .q .s.err { color: #ffb1b1; }
  .q .s.ok { color: var(--accent); font-weight: 700; }
  .q .t { font-weight: 700; overflow-wrap: anywhere; }
  .prog { height: 4px; background: var(--surface-2); border-radius: 9px; overflow: hidden; position: relative; }
  .prog::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 38%; background: var(--accent); animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
  @media (max-width: 520px) { .q { grid-template-columns: 1fr; } .q .pv { aspect-ratio: 16 / 9; } }

  /* profile + account */
  .me { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .me img { width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--accent); }
  .me .n { font-size: 24px; font-weight: 900; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stats div { background: var(--surface-2); border-radius: 12px; padding: 6px 16px; font-size: 13px; color: var(--muted); }
  .stats b { color: var(--fg); font-size: 17px; margin-inline-end: 6px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 22px; font-size: 14px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .on { color: var(--accent); font-weight: 700; }
  .own { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .edit { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--accent); border-radius: 14px; padding: 12px; }

  /* player overlay */
  #overlay { position: fixed; inset: 0; z-index: 40; background: #060504; overflow-y: auto; overscroll-behavior: contain;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(10px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); }
  .pl { max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 8px 26px; align-items: start; }
  .pl > .bar { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .pclose { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
  .pclose:hover { border-color: var(--accent); color: var(--accent); }
  .pmain { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .pmain video { width: 100%; max-height: 74vh; background: #000; border-radius: 18px; aspect-ratio: 16 / 9; display: block; object-fit: contain; }
  .pmain video.portrait { aspect-ratio: 9 / 16; max-width: min(100%, 420px); margin: 0 auto; max-height: 78vh; }
  .pmain h1 { font-size: clamp(20px, 3.4vw, 28px); overflow-wrap: anywhere; }
  .speed { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  .descbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .mini { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px; cursor: pointer; align-items: start; }
  .mini .thumb { border-radius: 10px; }
  .mini h3 { font-size: 14px; margin: 0 0 2px; }
  @media (max-width: 900px) { .pl { grid-template-columns: minmax(0, 1fr); } }

  @media (prefers-reduced-motion: reduce) { .sk, .prog::after, .burst { animation: none; } .drop, .vc *, .btn { transition: none; } }

.edit input,.edit textarea{width:100%}.edit .btn{justify-content:center}.cform{display:flex;gap:8px;margin-top:10px}.cform input{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.who{color:var(--muted);text-decoration:none}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--accent);padding:8px 18px;border-radius:12px;z-index:99}
</style></head><body>
<div class="wrap"><header class="top"><a class="brand" href="#watch"><span class="mark"><svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg></span>جعبه&nbsp;<b>ویدیو</b></a><nav class="tabs" id="nav"></nav></header><main id="main"></main></div>
<div id="overlay" hidden></div>
<script>window.__app=function(){/* ====== تنظیمات: مقدار Firebase خودت رو اینجا بذار ====== */
var FIREBASE_CONFIG = { apiKey:"", authDomain:"", projectId:"", storageBucket:"", messagingSenderId:"", appId:"" };
var OWNER_EMAIL = "parsaxgamer65@gmail.com";
var MAX_MB = 200;
/* ======================================================== */
(function(){
"use strict";
if(!FIREBASE_CONFIG.apiKey){document.body.innerHTML='<p style="padding:24px;color:#fff;direction:rtl;line-height:2">کلیدهای Firebase هنوز وارد نشدن.<br>فایل index.html رو باز کن و مقدار FIREBASE_CONFIG (apiKey و ...) رو از کنسول Firebase کپی کن و اونجا بذار.</p>';return}
try{firebase.initializeApp(FIREBASE_CONFIG)}catch(e){document.body.innerHTML='<p style="padding:24px;color:#fff;direction:rtl">خطا در Firebase: '+e.message+'</p>';return}
var auth=firebase.auth(), db=firebase.firestore(), st=firebase.storage(), FV=firebase.firestore.FieldValue;
var $=function(s){return document.querySelector(s)};
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function btn(c,x,f){var b=el("button",c,x);b.type="button";if(f)b.onclick=f;return b}
function inp(type,ph,v){var i=document.createElement("input");i.type=type;i.placeholder=ph;if(v)i.value=v;return i}
function toast(m){var o=$("#toast");if(o)o.remove();var t=el("div","toast",m);t.id="toast";document.body.appendChild(t);setTimeout(function(){t.remove()},3000)}
var me=null, mine=null, unsub=null, cache={};
var isOwner=function(u){return u&&u.email&&u.email.toLowerCase()===OWNER_EMAIL&&u.emailVerified};
var role=function(){return isOwner(auth.currentUser)?"owner":(mine&&mine.role)||"user"};
var isStaff=function(){return role()==="owner"||role()==="admin"};
function avatar(u,sz){var a=el("img");a.alt="";a.style.cssText="width:"+sz+"px;height:"+sz+"px;border-radius:50%;object-fit:cover;background:#2a2521";a.src=(u&&u.photo)||"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E";return a}
async function userById(uid){if(cache[uid])return cache[uid];var d=await db.collection("users").doc(uid).get();return cache[uid]=d.exists?Object.assign({uid:uid},d.data()):{uid:uid,name:"کاربر",handle:"?"}}
function go(h){location.hash=h}
function clean(x,n){return String(x||"").replace(/\s+/g," ").trim().slice(0,n)}

/* ---------- auth ---------- */
auth.onAuthStateChanged(function(u){
  me=u; if(unsub){unsub();unsub=null}
  if(!u){mine=null;render();return}
  unsub=db.collection("users").doc(u.uid).onSnapshot(function(d){mine=d.exists?d.data():null;cache[u.uid]=mine&&Object.assign({uid:u.uid},mine);render()});
});
function pAuth(m){
  var mode="in",box=el("form","edit"),h=el("h1",null,"ورود به جعبه ویدیو");
  var em=inp("email","ایمیل"),p1=inp("password","رمز عبور"),p2=inp("password","تکرار رمز عبور");
  em.autocomplete="email";p2.hidden=true;
  var go1=el("button","btn","ورود");go1.type="submit";
  var sw=btn("ghost","حساب نداری؟ ثبت‌نام",function(){mode=mode==="in"?"up":"in";p2.hidden=mode==="in";go1.textContent=mode==="in"?"ورود":"ثبت‌نام";h.textContent=mode==="in"?"ورود به جعبه ویدیو":"ساخت حساب";sw.textContent=mode==="in"?"حساب نداری؟ ثبت‌نام":"حساب داری؟ ورود"});
  var g=btn("btn","ورود با گوگل",function(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){toast("ورود با گوگل انجام نشد")})});
  box.onsubmit=async function(e){e.preventDefault();
    try{
      if(mode==="up"){
        if(p1.value.length<6)return toast("رمز باید حداقل ۶ کاراکتر باشد.");
        if(p1.value!==p2.value)return toast("دو رمز یکسان نیستند.");
        var c=await auth.createUserWithEmailAndPassword(em.value.trim(),p1.value);
        c.user.sendEmailVerification().catch(function(){});toast("ایمیل تایید فرستاده شد.");
      }else await auth.signInWithEmailAndPassword(em.value.trim(),p1.value);
    }catch(er){toast(er.code==="auth/email-already-in-use"?"این ایمیل قبلاً ثبت شده.":"ایمیل یا رمز اشتباه است.")}};
  [h,em,p1,p2,go1,g,sw].forEach(function(x){box.appendChild(x)});box.style.maxWidth="420px";m.appendChild(box);
}
function pSetup(m){
  var f=el("form","edit");f.style.maxWidth="420px";
  var nm=inp("text","نام نمایشی",auth.currentUser.displayName||""),hd=inp("text","آیدی (انگلیسی، مثل parsa_65)");hd.dir="ltr";
  var s=el("button","btn","ساخت پروفایل");s.type="submit";
  [el("h1",null,"آیدی خودت رو انتخاب کن"),nm,hd,s].forEach(function(x){f.appendChild(x)});
  f.onsubmit=async function(e){e.preventDefault();
    var h=hd.value.trim().toLowerCase();
    if(!/^[a-z0-9_]{3,20}$/.test(h))return toast("آیدی: ۳ تا ۲۰ حرف انگلیسی/عدد/_");
    var u=auth.currentUser,b=db.batch();
    try{
      var ex=await db.collection("handles").doc(h).get();if(ex.exists)return toast("این آیدی گرفته شده.");
      b.set(db.collection("handles").doc(h),{uid:u.uid});
      b.set(db.collection("users").doc(u.uid),{name:clean(nm.value,40)||h,handle:h,photo:u.photoURL||"",email:u.email,role:"user",banned:false,noUpload:false,noChat:false,createdAt:FV.serverTimestamp()});
      await b.commit();
    }catch(er){toast("ساخته نشد: "+er.code)}};
  m.appendChild(f);
}

/* ---------- videos ---------- */
function vcard(v){
  var c=el("article","vc");c.tabIndex=0;
  var t=el("div","thumb"),vv=document.createElement("video");vv.src=v.url+"#t=0.5";vv.preload="metadata";vv.muted=true;t.appendChild(vv);
  c.appendChild(t);c.appendChild(el("h3",null,v.title));
  var w=el("a","who",v.ownerName||"");w.href="#u/"+v.ownerHandle;w.onclick=function(e){e.stopPropagation()};c.appendChild(w);
  c.onclick=function(){play(v)};
  if(me&&(v.ownerId===me.uid||isStaff())){var d=btn("ghost del","حذف",async function(e){e.stopPropagation();if(!confirm("حذف شود؟"))return;await db.collection("videos").doc(v.id).delete();try{await st.refFromURL(v.url).delete()}catch(x){}render()});c.appendChild(d)}
  return c;
}
function play(v){
  var o=$("#overlay");o.textContent="";o.hidden=false;document.body.classList.add("lock");
  var pl=el("div","pl"),b=el("div","bar");b.appendChild(el("span","count",v.title));b.appendChild(btn("pclose","✕",close));pl.appendChild(b);
  var mn=el("div","pmain"),vd=document.createElement("video");vd.controls=true;vd.autoplay=true;vd.playsInline=true;vd.src=v.url;mn.appendChild(vd);
  mn.appendChild(el("h1",null,v.title));mn.appendChild(el("p","sub",v.description||""));pl.appendChild(mn);o.appendChild(pl);
  function close(){vd.pause();o.hidden=true;o.textContent="";document.body.classList.remove("lock")}
}
function grid(list){var g=el("div","grid");if(!list.length)return el("div","sub","ویدیویی نیست.");list.forEach(function(v){g.appendChild(vcard(v))});return g}
async function loadVideos(q){var s=await q.orderBy("createdAt","desc").limit(60).get();return s.docs.map(function(d){return Object.assign({id:d.id},d.data())})}
async function pWatch(m){
  var box=el("div");m.appendChild(el("h1",null,"تماشا"));m.appendChild(box);
  box.appendChild(grid(await loadVideos(db.collection("videos"))));
}
function pUpload(m){
  m.appendChild(el("h1",null,"آپلود ویدیو"));
  if(mine.banned)return m.appendChild(el("div","sub","حساب شما بن شده."));
  if(mine.noUpload&&!isStaff())return m.appendChild(el("div","sub","اجازه آپلود برای شما غیرفعال شده."));
  var f=el("form","edit"),file=document.createElement("input");file.type="file";file.accept="video/*";
  var t=inp("text","عنوان"),d=document.createElement("textarea");d.placeholder="توضیحات";
  var s=el("button","btn","آپلود");s.type="submit";var pr=el("div","sub");
  [file,t,d,s,pr].forEach(function(x){f.appendChild(x)});m.appendChild(f);
  f.onsubmit=function(e){e.preventDefault();var fl=file.files[0];
    if(!fl)return toast("یه ویدیو انتخاب کن.");if(fl.size>MAX_MB*1048576)return toast("حداکثر "+MAX_MB+" مگابایت.");
    s.disabled=true;var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    var task=st.ref("videos/"+me.uid+"/"+id).put(fl,{contentType:fl.type});
    task.on("state_changed",function(x){pr.textContent=Math.round(x.bytesTransferred/x.totalBytes*100)+"٪"},function(er){toast("آپلود نشد: "+er.code);s.disabled=false},async function(){
      var url=await task.snapshot.ref.getDownloadURL();
      await db.collection("videos").add({ownerId:me.uid,ownerName:mine.name,ownerHandle:mine.handle,title:clean(t.value,120)||"بدون نام",description:clean(d.value,800),url:url,createdAt:FV.serverTimestamp()});
      toast("آپلود شد.");go("watch")});
  };
}

/* ---------- search / profile / admin ---------- */
function pSearch(m){
  m.appendChild(el("h1",null,"جستجوی کاربر"));
  var i=inp("search","آیدی دوستت رو بنویس…");i.dir="ltr";var r=el("div");m.appendChild(i);m.appendChild(r);
  i.oninput=async function(){var q=i.value.trim().toLowerCase().replace(/^@/,"");r.textContent="";if(q.length<2)return;
    var s=await db.collection("users").orderBy("handle").startAt(q).endAt(q+"\uf8ff").limit(15).get();
    s.docs.forEach(function(d){var u=d.data(),a=el("a","who");a.href="#u/"+u.handle;a.style.cssText="display:flex;gap:10px;align-items:center;padding:8px 0";a.appendChild(avatar(u,40));a.appendChild(document.createTextNode(u.name+"  @"+u.handle));r.appendChild(a)});
    if(!s.size)r.appendChild(el("div","sub","کاربری پیدا نشد."))};
}
async function pProfile(m,handle){
  var h=await db.collection("handles").doc(handle).get();
  if(!h.exists)return m.appendChild(el("div","sub","کاربری با این آیدی نیست."));
  var u=await userById(h.data().uid),mineP=u.uid===me.uid;
  var hd=el("div","me");hd.appendChild(avatar(u,76));var n=el("div");n.appendChild(el("div","n",u.name));n.appendChild(el("div","sub","@"+u.handle+(u.role==="admin"?" · ادمین":"")+(isOwner({email:u.email,emailVerified:true})?" · اونر":"")+(u.banned?" · بن":"")));hd.appendChild(n);m.appendChild(hd);
  var ac=el("div","actions");
  if(!mineP)ac.appendChild(btn("btn","پیام",function(){go("chat/"+u.uid)}));
  if(mineP){
    var ph=document.createElement("input");ph.type="file";ph.accept="image/*";ph.hidden=true;
    ph.onchange=async function(){var im=await resize(ph.files[0],160);await db.collection("users").doc(me.uid).update({photo:im});toast("عکس پروفایل عوض شد.")};
    ac.appendChild(btn("ghost","عکس پروفایل",function(){ph.click()}));ac.appendChild(ph);
    ac.appendChild(btn("ghost","خروج",function(){auth.signOut()}));
  }
  m.appendChild(ac);
  if(!mineP&&isStaff()&&!(u.role==="admin"&&role()!=="owner")){
    var ad=el("div","actions");
    var flag=function(k,l){ad.appendChild(btn("ghost"+(u[k]?" confirm":""),(u[k]?"لغو ":"")+l,async function(){await db.collection("users").doc(u.uid).update(Object.assign({},{[k]:!u[k]}));delete cache[u.uid];render()}))};
    flag("banned","بن");flag("noUpload","No Upload");flag("noChat","No Chat");
    if(role()==="owner")ad.appendChild(btn("ghost",u.role==="admin"?"حذف ادمین":"تگ ادمین",async function(){await db.collection("users").doc(u.uid).update({role:u.role==="admin"?"user":"admin"});delete cache[u.uid];render()}));
    m.appendChild(el("h2",null,"مدیریت"));m.appendChild(ad);
  }
  m.appendChild(el("h2",null,"کانال "+u.name));
  m.appendChild(grid(await loadVideos(db.collection("videos").where("ownerId","==",u.uid))));
}
function resize(file,px){return new Promise(function(ok){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var c=document.createElement("canvas");c.width=c.height=px;var s=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,px,px);ok(c.toDataURL("image/jpeg",.8))};i.src=r.result};r.readAsDataURL(file)})}

/* ---------- chat (پیوی) ---------- */
var cunsub=null;
async function pChat(m,other){
  if(!other){
    m.appendChild(el("h1",null,"پیام‌ها"));
    var s=await db.collection("chats").where("members","array-contains",me.uid).orderBy("last","desc").limit(30).get();
    if(!s.size)m.appendChild(el("div","sub","هنوز پیامی نداری. از «جستجو» یه دوست پیدا کن."));
    for(var d of s.docs){var o=d.data().members.find(function(x){return x!==me.uid}),u=await userById(o),a=el("a","who",u.name+" — "+(d.data().text||""));a.href="#chat/"+o;a.style.display="block";m.appendChild(a)}
    return;
  }
  var u=await userById(other),cid=[me.uid,other].sort().join("_");
  m.appendChild(el("h1",null,u.name));
  var lst=el("div");lst.style.cssText="display:flex;flex-direction:column;gap:6px;min-height:200px";m.appendChild(lst);
  var blocked=mine.banned||(mine.noChat&&!isStaff());
  if(blocked)m.appendChild(el("div","sub","ارسال پیام برای شما غیرفعال شده."));
  else{var f=el("form","cform"),i=inp("text","پیام…"),b=el("button","btn","ارسال");b.type="submit";f.appendChild(i);f.appendChild(b);m.appendChild(f);
    f.onsubmit=async function(e){e.preventDefault();var t=clean(i.value,500);if(!t)return;i.value="";
      try{await db.collection("chats").doc(cid).collection("msgs").add({from:me.uid,text:t,at:FV.serverTimestamp()});
        await db.collection("chats").doc(cid).set({members:[me.uid,other],text:t,last:FV.serverTimestamp()})}catch(er){toast("ارسال نشد.")}}}
  cunsub=db.collection("chats").doc(cid).collection("msgs").orderBy("at").limitToLast(100).onSnapshot(function(s){
    lst.textContent="";s.docs.forEach(function(d){var x=d.data(),p=el("div",null,x.text);p.style.cssText="padding:6px 12px;border-radius:12px;max-width:80%;overflow-wrap:anywhere;background:"+(x.from===me.uid?"var(--accent);color:var(--accent-ink);align-self:flex-start":"var(--surface-2);align-self:flex-end");lst.appendChild(p)});window.scrollTo(0,document.body.scrollHeight)});
}

/* ---------- router ---------- */
var TABS=[["watch","تماشا"],["search","جستجو"],["upload","آپلود"],["chat","پیوی"],["me","پروفایل"]];
async function render(){
  if(cunsub){cunsub();cunsub=null}
  var m=$("#main"),nav=$("#nav");m.textContent="";nav.textContent="";
  if(me===undefined)return;
  var h=(location.hash||"#watch").slice(1).split("/"),pg=h[0];
  if(!me){return pAuth(m)}
  if(!mine){return pSetup(m)}
  if(mine.banned&&pg!=="me"){pg="me"}
  TABS.forEach(function(t){var a=el("a",null,t[1]);a.href="#"+t[0];if(t[0]===pg||(pg==="u"&&t[0]==="me"&&0))a.setAttribute("aria-current","page");nav.appendChild(a)});
  try{
    if(pg==="upload")pUpload(m);else if(pg==="search")pSearch(m);else if(pg==="chat")await pChat(m,h[1]);
    else if(pg==="u")await pProfile(m,h[1]);else if(pg==="me")await pProfile(m,mine.handle);else await pWatch(m);
  }catch(e){m.appendChild(el("div","sub","خطا: "+(e.code||e.message)+" (اگه ایندکس Firestore خواسته، لینک داخل کنسول مرورگر رو باز کن.)"))}
}
window.addEventListener("hashchange",render);me=undefined;
})();
};</script>
<script>
(function(){
var parts=["app","auth","firestore","storage"],V="10.12.2";
var hosts=[function(p){return "https://cdnjs.cloudflare.com/ajax/libs/firebase/"+V+"/firebase-"+p+"-compat.min.js"},
 function(p){return "https://www.gstatic.com/firebasejs/"+V+"/firebase-"+p+"-compat.js"},
 function(p){return "https://cdn.jsdelivr.net/npm/firebase@"+V+"/firebase-"+p+"-compat.js"}];
function load(p,h,cb){if(h>=hosts.length)return cb(false);var sc=document.createElement("script");sc.crossOrigin="anonymous";sc.src=hosts[h](p);sc.onload=function(){cb(true)};sc.onerror=function(){sc.remove();load(p,h+1,cb)};document.head.appendChild(sc)}
function step(i){
 if(i===parts.length){window.__app();return}
 load(parts[i],0,function(ok){if(!ok){document.body.innerHTML='<p style="padding:24px;color:#fff;direction:rtl">کتابخانه Firebase لود نشد. اینترنت/فیلترشکن رو چک کن و صفحه رو رفرش کن. اگه داخل پیش‌نمایش کلاد باز کردی، فایل رو روی دامنه یا گیت‌هاب آپلود کن و اونجا باز کن.</p>';return}step(i+1)})}
step(0);
})();
</script></body></html>
